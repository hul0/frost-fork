<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Frosty Fork | Premium Winter Dining</title>
    
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'header': ['"Cinzel"', 'serif'],
                        'body': ['"Lato"', 'sans-serif'],
                    },
                    colors: {
                        'night-blue': '#0f172a',
                        'aurora-green': '#10b981',
                        'gold-luxury': '#FFD700',
                    },
                    backgroundImage: {
                        'aurora': 'linear-gradient(125deg, #000428 0%, #004e92 30%, #2c3e50 60%, #4ca1af 100%)',
                    },
                    animation: {
                        'aurora-move': 'aurora 20s ease infinite',
                        'pulse-gold': 'pulseGold 2s infinite',
                    },
                    keyframes: {
                        aurora: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        },
                        pulseGold: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(255, 215, 0, 0.4)' },
                            '70%': { boxShadow: '0 0 0 10px rgba(255, 215, 0, 0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-body bg-aurora animate-aurora-move min-h-screen selection:bg-cyan-500 selection:text-white">

    <canvas class="canvas fixed inset-0 pointer-events-none z-0 w-full h-full opacity-80" id="snowCanvas"></canvas>

    <nav class="fixed w-full z-50 transition-all duration-300 top-0 left-0" id="navbar">
        <div class="glass-panel mx-4 mt-4 rounded-full px-8 py-4 flex justify-between items-center max-w-7xl lg:mx-auto shadow-[0_0_15px_rgba(186,230,253,0.15)]">
            <div class="flex items-center gap-3">
                <i class="fa-regular fa-snowflake text-3xl text-cyan-400 animate-spin-slow shadow-glow"></i>
                <h1 class="font-header text-2xl font-bold tracking-widest text-white uppercase">
                    The Frosty <span class="text-cyan-400">Fork</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-6">
                <button onclick="toggleMusic(this)" class="text-slate-400 hover:text-white transition-colors hidden sm:block">
                    <i class="fas fa-volume-mute text-xl"></i>
                </button>

                <button onclick="toggleCart()" class="relative p-2 hover:bg-white/10 rounded-full transition-colors group" id="cart-btn-nav">
                    <i class="fa-solid fa-sleigh text-2xl text-slate-300 group-hover:text-cyan-300 transition-colors"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-gradient-to-r from-red-600 to-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full transform scale-0 transition-transform duration-300 border border-white/20">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="relative min-h-screen flex items-center justify-center px-4 overflow-hidden perspective-container" id="hero">
        <div class="absolute top-1/4 left-10 w-24 h-24 bg-blue-500/20 blur-3xl rounded-full parallax-el" data-speed="0.05"></div>
        <div class="absolute bottom-1/3 right-10 w-48 h-48 bg-purple-500/20 blur-3xl rounded-full parallax-el" data-speed="0.08"></div>
        
        <div class="z-10 text-center max-w-5xl mx-auto" id="hero-content">
            <div class="mb-4 inline-block">
                <span class="py-1 px-4 border border-cyan-500/30 rounded-full bg-cyan-900/30 backdrop-blur-sm text-cyan-300 text-sm font-bold tracking-widest uppercase mb-4 animate-pulse">
                    Reservations Closing Soon
                </span>
            </div>
            
            <h2 class="font-header text-6xl md:text-8xl font-bold mb-6 leading-tight drop-shadow-2xl">
                <span class="text-gradient-ice block">Dining In The</span>
                <span class="text-gradient-gold block mt-2">Aurora Lights</span>
            </h2>
            
            <p class="text-lg md:text-xl text-slate-300 mb-10 max-w-2xl mx-auto leading-relaxed">
                Experience a culinary winter wonderland where every dish is crafted with frost, fire, and magic.
            </p>

            <div class="flex flex-col md:flex-row justify-center gap-6">
                <a href="#menu" class="group relative px-8 py-4 bg-white/10 overflow-hidden rounded-full backdrop-blur-sm border border-white/30 text-white font-bold transition-all hover:border-cyan-400">
                    <div class="absolute inset-0 w-0 bg-cyan-500/20 transition-all duration-[250ms] ease-out group-hover:w-full"></div>
                    <span class="relative flex items-center gap-2">Explore Menu <i class="fas fa-arrow-down group-hover:translate-y-1 transition-transform"></i></span>
                </a>
            </div>

            <div class="mt-16 grid grid-cols-4 gap-4 max-w-lg mx-auto text-center glass-panel p-4 rounded-xl">
                <div><span class="block font-header text-2xl text-cyan-400" id="days">00</span><span class="text-xs text-slate-400 uppercase">Days</span></div>
                <div><span class="block font-header text-2xl text-cyan-400" id="hours">00</span><span class="text-xs text-slate-400 uppercase">Hrs</span></div>
                <div><span class="block font-header text-2xl text-cyan-400" id="mins">00</span><span class="text-xs text-slate-400 uppercase">Mins</span></div>
                <div><span class="block font-header text-2xl text-cyan-400" id="secs">00</span><span class="text-xs text-slate-400 uppercase">Secs</span></div>
            </div>
        </div>
    </header>

    <main id="menu" class="relative z-10 max-w-7xl mx-auto px-4 py-24">
        <div class="flex flex-wrap justify-center gap-4 mb-16" id="filters">
            <button onclick="filterMenu('all')" class="filter-btn active px-8 py-2 rounded-full border border-white/10 text-slate-300 font-bold hover:bg-white/10 hover:text-white transition-all bg-white/5 backdrop-blur-md">All</button>
            <button onclick="filterMenu('warm')" class="filter-btn px-8 py-2 rounded-full border border-white/10 text-slate-300 font-bold hover:bg-white/10 hover:text-white transition-all bg-white/5 backdrop-blur-md">Warmers</button>
            <button onclick="filterMenu('sweet')" class="filter-btn px-8 py-2 rounded-full border border-white/10 text-slate-300 font-bold hover:bg-white/10 hover:text-white transition-all bg-white/5 backdrop-blur-md">Sweets</button>
            <button onclick="filterMenu('savory')" class="filter-btn px-8 py-2 rounded-full border border-white/10 text-slate-300 font-bold hover:bg-white/10 hover:text-white transition-all bg-white/5 backdrop-blur-md">Savory</button>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 perspective-container">
            </div>
    </main>

    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden transition-opacity duration-300 opacity-0"></div>
    
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-[#0f172a]/90 backdrop-blur-xl border-l border-white/20 z-[70] transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col shadow-2xl">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
            <h2 class="font-header text-2xl text-white"><i class="fas fa-shopping-bag text-cyan-400 mr-2"></i> Your Sleigh</h2>
            <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 hover:bg-red-500/20 hover:text-red-400 transition-all">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="p-6 border-t border-white/10 bg-white/5">
            <div class="flex justify-between items-center mb-6 text-slate-200">
                <span class="text-sm uppercase tracking-wider">Total Amount</span>
                <span id="cart-total" class="font-header text-2xl text-cyan-400 font-bold">$0.00</span>
            </div>
            
            <button onclick="checkout()" class="snow-btn">
                <span class="relative z-10 flex justify-center items-center gap-2">Proceed to Checkout <i class="fas fa-arrow-right"></i></span>
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[80] glass-panel px-6 py-3 rounded-full flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 shadow-2xl">
        <i class="fas fa-check-circle text-aurora-green"></i>
        <span id="toast-msg" class="text-sm font-semibold text-white">Item added</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
